app:
  resend:
    api-key: "FAKE_RESEND_API_KEY"

  rabbitmq:
    queues:
      messaging-account:
        retry-delay: 2s
        retries: 3

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false

logging:
  level:
    org.hibernate.sql: TRACE
